<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Lea!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="board" id="board">

  <!-- ===== TITLE ===== -->
  <h1 class="title">
    <span class="title-line1">Happy Birthday</span>
    <span class="title-line2">Lea<span class="title-bang">!</span></span>
  </h1>

  <div class="board-main">

    <!-- ===== FRAME GRID ===== -->
    <div class="frame-grid">

      <div class="frame area-f1" style="--rot:-5deg">
        <div class="frame__inner" data-label="+ photo-1.jpg">
          <img src="photo1.jpeg" alt="Memory photo 1" onerror="this.closest('.frame').classList.add('is-empty')">
        </div>
        <span class="tape tape--top" style="--tape-rot:-32deg"></span>
      </div>

      <div class="frame area-f2" style="--rot:3deg">
        <div class="frame__inner" data-label="+ photo-2.jpg">
          <img src="photo2.jpeg" alt="Memory photo 2" onerror="this.closest('.frame').classList.add('is-empty')">
        </div>
      </div>

      <div class="frame area-hero" style="--rot:-2deg">
        <div class="frame__inner" data-label="+ photo-3.jpg">
          <img src="photo3.jpeg" alt="Memory photo 3" onerror="this.closest('.frame').classList.add('is-empty')">
        </div>
        <span class="tape tape--top" style="--tape-rot:-40deg"></span>
        <span class="tape tape--right" style="--tape-rot:35deg"></span>
      </div>

      <div class="frame area-f1b" style="--rot:4deg">
        <div class="frame__inner" data-label="+ photo-4.jpg">
          <img src="photo4.jpeg" alt="Memory photo 4" onerror="this.closest('.frame').classList.add('is-empty')">
        </div>
        <span class="tape tape--top" style="--tape-rot:-20deg"></span>
      </div>

      <div class="frame area-f2b" style="--rot:-3deg">
        <div class="frame__inner" data-label="+ photo-5.jpg">
          <img src="photo5.jpeg" alt="Memory photo 5" onerror="this.closest('.frame').classList.add('is-empty')">
        </div>
      </div>

      <div class="frame area-f3" style="--rot:5deg">
        <div class="frame__inner" data-label="+ photo-6.jpg">
          <img src="photo6.jpeg" alt="Memory photo 6" onerror="this.closest('.frame').classList.add('is-empty')">
        </div>
      </div>

      <div class="frame area-f4" style="--rot:-4deg">
        <div class="frame__inner" data-label="+ photo-7.jpg">
          <img src="photo7.png" alt="Memory photo 7" onerror="this.closest('.frame').classList.add('is-empty')">
        </div>
        <span class="tape tape--top" style="--tape-rot:15deg"></span>
      </div>

      <div class="frame area-f5" style="--rot:2deg">
        <div class="frame__inner" data-label="+ photo-8.jpg">
          <img src="photo8.jpeg" alt="Memory photo 8" onerror="this.closest('.frame').classList.add('is-empty')">
        </div>
      </div>

    </div><!-- /frame-grid -->

    <!-- ===== PHOTOBOOTH STRIP ===== -->
    <div class="photobooth" style="--rot:2deg">
      <span class="tape tape--top" style="--tape-rot:-10deg"></span>
      <div class="photobooth__header">PHOTO&nbsp;BOOTH</div>
      <div class="photobooth__strip">
        <div class="booth-slot"><img src="booth1.jpeg" alt="Photo booth shot 1" onerror="this.closest('.booth-slot').classList.add('is-empty')"></div>
        <div class="booth-perf"></div>
        <div class="booth-slot"><img src="booth2.jpeg" alt="Photo booth shot 2" onerror="this.closest('.booth-slot').classList.add('is-empty')"></div>
        <div class="booth-perf"></div>
        <div class="booth-slot"><img src="booth3.jpeg" alt="Photo booth shot 3" onerror="this.closest('.booth-slot').classList.add('is-empty')"></div>
        <div class="booth-perf"></div>
        <div class="booth-slot"><img src="booth4.jpeg" alt="Photo booth shot 4" onerror="this.closest('.booth-slot').classList.add('is-empty')"></div>
        <div class="booth-perf"></div>
        <div class="booth-slot"><img src="booth5.png" alt="Photo booth shot 5" onerror="this.closest('.booth-slot').classList.add('is-empty')"></div>
        <div class="booth-perf"></div>
        <div class="booth-slot"><img src="booth6.jpeg" alt="Photo booth shot 6" onerror="this.closest('.booth-slot').classList.add('is-empty')"></div>
      </div>
    </div>

  </div><!-- /board-main -->

  <!-- ===== STICKY NOTES ===== -->
  <div class="notes-layer" aria-hidden="false">

    <div class="note note--yellow" style="--rot:-6deg; top:14%; left:2%;">
      <span class="pin pin--red"></span>
      “You are the light of the world. A town built on a hill cannot be hidden.” - Matthew 5:16 NIV
    </div>

    <div class="note note--pink" style="--rot:5deg; top:41%; left:1.5%;">
      <span class="pin pin--blue"></span>
      09/12 - 09/22 EGIPTE!!!!!
    </div>

    <div class="note note--green" style="--rot:6deg; top:1%; left:70%;">
      <span class="pin pin--red"></span>
      09/20 - Lea kom Paarl toe
    </div>

  </div>

</div><!-- /board -->

<canvas id="confetti"></canvas>

<script src="script.js"></script>
</body>
</html>
